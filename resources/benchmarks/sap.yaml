- name: __defaults__
  max_mem_size_mb: 24576

- name: gender
  dataset:
    train:
      - '{input}/gender_train_0.csv'
      - '{input}/gender_train_1.csv'
      - '{input}/gender_train_2.csv'
      - '{input}/gender_train_3.csv'
      - '{input}/gender_train_4.csv'
    test:
      - '{input}/gender_test_0.csv'
      - '{input}/gender_test_1.csv'
      - '{input}/gender_test_2.csv'
      - '{input}/gender_test_3.csv'
      - '{input}/gender_test_4.csv'
    target: label
  type: binary
  metric:
    - auc

- name: mortality
  dataset:
    train:
      - '{input}/mortality_train_0.csv'
      - '{input}/mortality_train_1.csv'
      - '{input}/mortality_train_2.csv'
      - '{input}/mortality_train_3.csv'
      - '{input}/mortality_train_4.csv'
    test:
      - '{input}/mortality_test_0.csv'
      - '{input}/mortality_test_1.csv'
      - '{input}/mortality_test_2.csv'
      - '{input}/mortality_test_3.csv'
      - '{input}/mortality_test_4.csv'
    target: label
  type: binary
  metric:
    - auc

- name: age
  dataset:
    train:
      - '{input}/age_train_0.csv'
      - '{input}/age_train_1.csv'
      - '{input}/age_train_2.csv'
      - '{input}/age_train_3.csv'
      - '{input}/age_train_4.csv'
    test:
      - '{input}/age_test_0.csv'
      - '{input}/age_test_1.csv'
      - '{input}/age_test_2.csv'
      - '{input}/age_test_3.csv'
      - '{input}/age_test_4.csv'
    target: label
  type: regression
  metric:
    - rmse